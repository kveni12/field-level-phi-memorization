[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "field-level-phi-memorization"
version = "1.0.0"
description = "Synthetic matched PHI/benign corpus, fine-tuning, prefix attacks, and first-token Jacobian-lens analysis."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["matplotlib>=3.8", "numpy>=1.26", "Pillow>=10", "pyyaml>=6.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
training = ["torch>=2.2", "transformers>=4.44", "datasets>=2.20", "accelerate>=0.33", "sentencepiece", "protobuf", "zstandard", "wandb>=0.17"]
name-generation = ["openai>=1.40.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
