name: CPU validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python scripts/reproduce_dataset.py --output-dir outputs/reproduced-data
      - run: MPLBACKEND=Agg python scripts/reproduce_paper_figures.py --output-dir outputs/paper-figures
